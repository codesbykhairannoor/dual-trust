<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#080D18" />
      <stop offset="100%" stop-color="#03060B" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Left Wing / Human Credit Gradient (Electric Cyan / Azure) -->
    <linearGradient id="humanWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="humanFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Right Wing / Agent Standing Gradient (Royal Violet / Indigo) -->
    <linearGradient id="agentWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="agentFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Interlocking Gate Border Gradient -->
    <linearGradient id="gateBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Cryptographic Shield Boundary -->
  <path d="M256 44 L416 104 C416 264 348 388 256 456 C164 388 96 264 96 104 Z"
        fill="none" stroke="url(#gateBorder)" stroke-width="2" stroke-dasharray="10 6" opacity="0.6" />

  <path d="M256 60 L398 114 C398 254 336 366 256 432 C176 366 114 254 114 114 Z"
        fill="#070C16" fill-opacity="0.65" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Light Halos -->
  <circle cx="200" cy="240" r="90" fill="#0284C7" opacity="0.14" filter="url(#intenseGlow)" />
  <circle cx="312" cy="240" r="90" fill="#7C3AED" opacity="0.14" filter="url(#intenseGlow)" />

  <!-- ======================================================== -->
  <!-- DUAL-TRUST EMBLEM: DUAL INTERLOCKING CYBERNETIC SHIELDS -->
  <!-- ======================================================== -->

  <!-- LEFT PILLAR / HUMAN CREDIT SHIELD -->
  <g id="humanShield" filter="url(#coreGlow)">
    <!-- Base Polygon -->
    <path d="M236 120 L160 164 L160 300 L236 352 L236 292 L196 264 L196 200 L236 176 Z"
          fill="url(#humanWing)" />
    <!-- 3D Bevel Facet -->
    <path d="M236 120 L160 164 L196 200 L236 176 Z" fill="url(#humanFacet)" opacity="0.9" />
    <path d="M160 300 L236 352 L236 292 L196 264 Z" fill="#0369A1" opacity="0.8" />
  </g>

  <!-- RIGHT PILLAR / AGENT REPUTATION SHIELD -->
  <g id="agentShield" filter="url(#coreGlow)">
    <!-- Base Polygon -->
    <path d="M276 120 L352 164 L352 300 L276 352 L276 292 L316 264 L316 200 L276 176 Z"
          fill="url(#agentWing)" />
    <!-- 3D Bevel Facet -->
    <path d="M276 120 L352 164 L316 200 L276 176 Z" fill="url(#agentFacet)" opacity="0.9" />
    <path d="M352 300 L276 352 L276 292 L316 264 Z" fill="#581C87" opacity="0.8" />
  </g>

  <!-- CENTER CRYPTOGRAPHIC GATING NEXUS (LOCK CORE) -->
  <g id="centerGate" filter="url(#intenseGlow)">
    <!-- Top & Bottom Interlocking Keystones -->
    <polygon points="256,150 274,166 256,182 238,166" fill="#F8FAFC" />
    <polygon points="256,290 274,306 256,322 238,306" fill="#F8FAFC" />

    <!-- Center Security Diamond / Merkle Root -->
    <polygon points="256,206 290,236 256,266 222,236" fill="#0F172A" stroke="url(#gateBorder)" stroke-width="2.5" />
    <polygon points="256,218 274,236 256,254 238,236" fill="url(#gateBorder)" />
    <circle cx="256" cy="236" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Cryptographic Pulse Nodes & Concurrency Strands -->
  <line x1="236" y1="236" x2="222" y2="236" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="276" y1="236" x2="290" y2="236" stroke="#C084FC" stroke-width="2" stroke-dasharray="2 2" />
  
  <line x1="196" y1="200" x2="238" y2="166" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
  <line x1="316" y1="200" x2="274" y2="166" stroke="#C084FC" stroke-width="1.5" opacity="0.6" />
  <line x1="196" y1="264" x2="238" y2="306" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
  <line x1="316" y1="264" x2="274" y2="306" stroke="#C084FC" stroke-width="1.5" opacity="0.6" />

  <!-- Precision Corner Nodes -->
  <circle cx="160" cy="164" r="3.5" fill="#BAE6FD" />
  <circle cx="352" cy="164" r="3.5" fill="#F5D0FE" />
  <circle cx="160" cy="300" r="3.5" fill="#38BDF8" />
  <circle cx="352" cy="300" r="3.5" fill="#C084FC" />

  <!-- Formal Technical Title at Base -->
  <text x="256" y="470" font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="700" letter-spacing="4" fill="#94A3B8" text-anchor="middle">
    DUALTRUST &bull; RUNTIME
  </text>
</svg>
