<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <!-- Card Background -->
  <rect width="960" height="280" rx="16" fill="#0A0E17" />
  <rect x="1" y="1" width="958" height="278" rx="15" fill="none" stroke="#1E293B" stroke-width="1.2" />

  <!-- ======================================================== -->
  <!-- LEFT: MINIMALIST FLAT HEX-VAULT EMBLEM (CENTERED)        -->
  <!-- ======================================================== -->
  <g transform="translate(145, 140) scale(0.60) translate(-256, -256)">
    <!-- Left Vault Wing: Human Credential (Cobalt #2563EB) -->
    <polygon points="
      136,176 
      248,111 
      248,206 
      200,234 
      200,278 
      248,306 
      248,401 
      136,336" 
      fill="#2563EB" />

    <!-- Right Vault Wing: Agent Reputation (Titanium #FFFFFF) -->
    <polygon points="
      376,176 
      264,111 
      264,206 
      312,234 
      312,278 
      264,306 
      264,401 
      376,336" 
      fill="#FFFFFF" />

    <!-- Center Verification Core: Solid Cryptographic Core Accent (#38BDF8) -->
    <polygon points="
      256,228 
      284,244 
      284,268 
      256,284 
      228,268 
      228,244" 
      fill="#38BDF8" />
  </g>

  <!-- Vertical Subtle Divider -->
  <line x1="264" y1="46" x2="264" y2="234" stroke="#1E293B" stroke-width="1" />

  <!-- ======================================================== -->
  <!-- RIGHT: PRECISION ENGINEERING TYPOGRAPHY                  -->
  <!-- ======================================================== -->

  <!-- Title: Flat high-contrast typography -->
  <text x="296" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Dual</tspan><tspan fill="#3B82F6">Trust</tspan>
  </text>

  <!-- Tagline -->
  <text x="298" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">
    ASYMMETRIC REPUTATION &amp; RUNTIME GATEKEEPER FOR AI AGENTS
  </text>

  <!-- Specification Pills -->
  <g transform="translate(298, 146)">
    <!-- Pill 1: Merkle Tree -->
    <g transform="translate(0, 0)">
      <rect width="144" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="72" y="17" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        RFC 6962 Merkle Tree
      </text>
    </g>

    <!-- Pill 2: Slashing -->
    <g transform="translate(154, 0)">
      <rect width="144" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="72" y="17" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        Power-Law Slashing v1.8
      </text>
    </g>

    <!-- Pill 3: NIST HITL -->
    <g transform="translate(308, 0)">
      <rect width="144" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="72" y="17" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        NIST SP 800-63B HITL
      </text>
    </g>

    <!-- Pill 4: Zero Deps -->
    <g transform="translate(462, 0)">
      <rect width="144" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="72" y="17" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        Zero Dependencies
      </text>
    </g>
  </g>

  <!-- Footer Status Line -->
  <g transform="translate(298, 206)">
    <!-- Status Dot -->
    <circle cx="6" cy="6" r="4.5" fill="#10B981" />
    <text x="18" y="10" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#CBD5E1">
      v0.4.4
    </text>

    <text x="68" y="10" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">
      •  Production Ready  •  MIT Licensed  •  Pure Python 3.10+
    </text>
  </g>
</svg>
